name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  unit-test-backend:
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.test-backend.outputs.report }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          cache-dependency-path: bugtracker-backend/go.sum
      
      - name: Install go-junit-report
        run: go install github.com/jstemmer/go-junit-report@latest

      - name: Execute backend unit tests
        id: test-backend
        working-directory: ./bugtracker-backend
        run: |
          go test -json -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out > coverage.txt
          echo "Go Test Coverage Results:" > ${GITHUB_STEP_SUMMARY}
          echo '```' >> ${GITHUB_STEP_SUMMARY}
          cat coverage.txt >> ${GITHUB_STEP_SUMMARY}

          echo '```' >> ${GITHUB_STEP_SUMMARY}

          {
            echo 'coverage<<EOF'
            cat coverage.txt
            echo EOF
          } >> "$GITHUB_OUTPUT"

          go test -v ./... 2>&1 | go-junit-report > test-results.xml
      
      - name: Publish Backend Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Backend Unit Tests Results
          path: bugtracker-backend/test-results.xml
          reporter: jest-junit

  unit-test-frontend:
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.test-frontend.outputs.report }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bugtracker-frontend/package-lock.json

      - name: Execute frontend unit tests
        id: test-frontend 
        working-directory: ./bugtracker-frontend
        run: |
          npm ci
          npm test | tee full_output.txt

          echo "Frontend Test Coverage Report:" > ${GITHUB_STEP_SUMMARY} 
          echo '```' >> ${GITHUB_STEP_SUMMARY}
          cat full_output.txt >> ${GITHUB_STEP_SUMMARY}
          echo '```' >> ${GITHUB_STEP_SUMMARY}

          echo 'report<<EOF' >> "$GITHUB_OUTPUT"
          cat full_output.txt >> "$GITHUB_OUTPUT"
          echo EOF >> "$GITHUB_OUTPUT"
      
      - name: Publish Frontend Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Frontend Unit Tests Results
          path: bugtracker-frontend/test-results.xml
          reporter: jest-junit
        
  create-coverage-comment:
    if : github.event_name == 'pull_request'
    needs: [unit-test-backend, unit-test-frontend]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Create backend coverage comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ### Backend Test Coverage Results
            ```
            ${{ needs.unit-tests-backend.outputs.coverage }}
            ```

      - name: Create frontend coverage comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ### Frontend Test Coverage Result
            ```
            ${{ needs.unit-tests-frontend.outputs.coverage }}
            ```
    
  api-test:
    needs: [unit-test-backend, unit-test-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: launch application  
        run: |
          docker compose up --build -d
          npx wait-port http://localhost:8080/api/health -t 30000
      
      - name: Run API tests
        working-directory: ./tests-api
        run: |
          npm ci
          npx playwright test

      - name: Stutdown application
        run: docker compose down
      
      - name: Publish API Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: API Tests Results
          path: ./tests-api/test-results/
          retention-days: 30
        
      - name: Publish API Test Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: API Tests Playwright Report
          path: ./tests-api/playwright-report/
          retention-days: 30