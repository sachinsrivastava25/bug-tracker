name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  unit-test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.20'
          cache-dependencies-path: bug-tracker/go.sum
      - name: Execute backend unit tests
        working-directory: ./bugtracker-backend
        run: |
          go test -v ./...
  
  unit-test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bug-tracker-frontend/package-lock.json
          
      - name: Execute frontend unit tests
        working-directory: ./bugtracker-frontend
        run: |
          npm ci
          npm test
